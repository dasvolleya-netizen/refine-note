<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6f2e9"><link rel="manifest" href="./manifest.webmanifest"><title>Refine Note</title>
<style>
:root{--b:#f6f2e9;--c:#fffdf8;--i:#26343a;--m:#758087;--l:#e3ddd1;--a:#79a99d}
*{box-sizing:border-box}body{margin:0;background:var(--b);color:var(--i);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}
main{max-width:760px;margin:auto;padding:22px 16px 110px}h1{font:700 31px Georgia,serif;margin:4px 0}.muted{color:var(--m)}
.page{display:none}.active{display:block}.card{background:var(--c);border:1px solid var(--l);border-radius:22px;padding:18px;margin:14px 0}
.hero{background:linear-gradient(135deg,#e9f3ef,#fffdf8)}.big{font-size:34px;font-weight:800}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
button,.filebtn{border:0;border-radius:14px;padding:13px 15px;background:var(--a);color:white;font-weight:700;font:inherit;display:inline-block;text-align:center}
button.alt,.filebtn.alt{background:#edf0ec;color:var(--i)}button.danger{background:#b96f68}
input,textarea,select{width:100%;padding:12px;border:1px solid var(--l);border-radius:12px;background:white;font:inherit;margin:6px 0 12px}textarea{min-height:85px}
.item{padding:14px 0;border-bottom:1px solid var(--l)}.item:last-child{border-bottom:0}.tag{display:inline-block;background:#deebe7;border-radius:999px;padding:4px 8px;margin:3px;font-size:12px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.hidden{display:none}
nav{position:fixed;bottom:0;left:0;right:0;background:#fffdf8ee;border-top:1px solid var(--l);backdrop-filter:blur(8px)}
nav div{max-width:760px;margin:auto;display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom)}
nav button{background:transparent;color:var(--m);font-size:11px;padding:10px 2px}
</style></head><body><main>
<h1>Refine Note</h1><div class="muted">学んだことを、忘れっぱなしにしない。 v0.5</div>

<section id="home" class="page active">
<div class="card hero"><div class="muted">今日の復習</div><div class="big"><span id="due">0</span> 件</div><p class="muted">ノルマなし。できる分だけ進める。</p><button onclick="startReview()">復習を始める</button></div>
<div class="grid"><button class="card alt" onclick="newDoc()">＋ 資料を追加</button><button class="card alt" onclick="go('library')">▤ 資料庫</button><button class="card alt" onclick="newTerm()">ABC 用語集</button></div>
</section>

<section id="add" class="page"><h2 id="docFormTitle">資料を追加</h2><div class="card">
タイトル<input id="title">大分類<select id="category"><option>水処理</option><option>電気</option><option>機械</option><option>化学</option><option>言葉・文章</option><option>その他</option></select>
タグ<input id="tags" placeholder="例：ポンプ, 薬注">メモ<textarea id="memo"></textarea>
<div class="actions"><button onclick="saveDoc()">保存</button><button class="alt" onclick="go('library')">キャンセル</button></div></div></section>

<section id="library" class="page"><h2>資料庫</h2><input id="search" placeholder="タイトル・分類・タグ・メモを検索" oninput="renderDocs()"><div id="docs" class="card"></div></section>
<section id="detail" class="page"><h2>資料詳細</h2><div id="detailCard" class="card"></div></section>

<section id="terms" class="page"><h2>用語集</h2><div class="card"><h3 id="termFormTitle">用語を追加</h3>
用語・略語<input id="term">正式名称<input id="full">意味・補足<textarea id="termnote"></textarea>
<div class="actions"><button onclick="saveTerm()">保存</button><button class="alt" onclick="clearTermForm()">入力をクリア</button></div></div>
<input id="termSearch" placeholder="用語を検索" oninput="renderTerms()"><div id="termList" class="card"></div></section>

<section id="review" class="page"><h2>復習</h2><div id="reviewCard" class="card"></div></section>

<section id="settings" class="page"><h2>設定</h2><div class="card"><b>Refine Note v0.5</b><p class="muted">データはこの端末のブラウザ内に保存されます。</p>
<div class="actions"><button onclick="exportData()">バックアップを書き出す</button><label class="filebtn alt">バックアップを復元<input id="importFile" class="hidden" type="file" accept="application/json,.json" onchange="importData(event)"></label></div>
<p class="muted">復元すると、現在の資料・用語をバックアップ内容で置き換えます。</p></div></section>
</main>

<nav><div><button onclick="go('home')">⌂<br>ホーム</button><button onclick="go('library')">▤<br>資料庫</button><button onclick="newDoc()">＋<br>追加</button><button onclick="go('terms')">ABC<br>用語集</button><button onclick="go('settings')">⚙<br>設定</button></div></nav>

<script>
const D='rn_docs',T='rn_terms';let q=[],n=0,editingDocId=null,editingTermId=null;
const $=id=>document.getElementById(id);
const get=k=>{try{return JSON.parse(localStorage.getItem(k)||'[]')}catch{return[]}};
const set=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
const uid=()=>Date.now()+Math.random();
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function migrate(){let a=get(D),c=false;a.forEach(x=>{if(!x.id){x.id=uid();c=true}});if(c)set(D,a);let t=get(T),d=false;t.forEach(x=>{if(!x.id){x.id=uid();d=true}});if(d)set(T,t)}
function go(p){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));$(p).classList.add('active');if(p==='library')renderDocs();if(p==='terms')renderTerms();refresh();scrollTo(0,0)}
function newDoc(){editingDocId=null;$('docFormTitle').textContent='資料を追加';$('title').value='';$('category').value='水処理';$('tags').value='';$('memo').value='';go('add')}
function saveDoc(){let t=$('title').value.trim();if(!t)return alert('タイトルを入力してください');let a=get(D),obj={id:editingDocId||uid(),title:t,category:$('category').value,tags:$('tags').value.split(',').map(x=>x.trim()).filter(Boolean),memo:$('memo').value.trim()};if(editingDocId){let i=a.findIndex(x=>String(x.id)===String(editingDocId));if(i>=0)a[i]=obj}else a.unshift(obj);set(D,a);editingDocId=null;go('library')}
function renderDocs(){let s=($('search').value||'').toLowerCase(),a=get(D).filter(x=>(x.title+' '+x.category+' '+(x.tags||[]).join(' ')+' '+(x.memo||'')).toLowerCase().includes(s));$('docs').innerHTML=a.length?a.map(x=>`<div class="item" onclick="openDoc('${x.id}')"><b>${esc(x.title)}</b><br><span class="tag">${esc(x.category)}</span>${(x.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}<p>${esc(x.memo||'')}</p><small class="muted">タップで詳細 ›</small></div>`).join(''):'まだ資料がありません'}
function openDoc(i){let x=get(D).find(v=>String(v.id)===String(i));if(!x)return;$('detailCard').innerHTML=`<h2>${esc(x.title)}</h2><span class="tag">${esc(x.category)}</span>${(x.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}<p>${esc(x.memo||'メモなし').replace(/\n/g,'<br>')}</p><div class="actions"><button onclick="reviewOne('${x.id}')">この資料を復習</button><button class="alt" onclick="editDoc('${x.id}')">編集</button><button class="danger" onclick="deleteDoc('${x.id}')">削除</button><button class="alt" onclick="go('library')">戻る</button></div>`;go('detail')}
function editDoc(i){let x=get(D).find(v=>String(v.id)===String(i));if(!x)return;editingDocId=x.id;$('docFormTitle').textContent='資料を編集';$('title').value=x.title||'';$('category').value=x.category||'その他';$('tags').value=(x.tags||[]).join(', ');$('memo').value=x.memo||'';go('add')}
function deleteDoc(i){if(!confirm('この資料を削除しますか？'))return;set(D,get(D).filter(x=>String(x.id)!==String(i)));go('library')}
function newTerm(){clearTermForm();go('terms');setTimeout(()=>$('term').focus(),50)}
function clearTermForm(){editingTermId=null;$('termFormTitle').textContent='用語を追加';$('term').value='';$('full').value='';$('termnote').value=''}
function saveTerm(){let name=$('term').value.trim();if(!name)return alert('用語を入力してください');let a=get(T),obj={id:editingTermId||uid(),name,full:$('full').value.trim(),note:$('termnote').value.trim()};if(editingTermId){let i=a.findIndex(x=>String(x.id)===String(editingTermId));if(i>=0)a[i]=obj}else a.unshift(obj);set(T,a);clearTermForm();renderTerms();refresh()}
function renderTerms(){let s=($('termSearch').value||'').toLowerCase(),a=get(T).filter(x=>(x.name+' '+(x.full||'')+' '+(x.note||'')).toLowerCase().includes(s));$('termList').innerHTML=a.length?a.map(x=>`<div class="item"><b>${esc(x.name)}</b><div>${esc(x.full||'')}</div><p>${esc(x.note||'').replace(/\n/g,'<br>')}</p><div class="actions"><button class="alt" onclick="editTerm('${x.id}')">編集</button><button class="danger" onclick="deleteTerm('${x.id}')">削除</button></div></div>`).join(''):'まだ用語がありません'}
function editTerm(i){let x=get(T).find(v=>String(v.id)===String(i));if(!x)return;editingTermId=x.id;$('termFormTitle').textContent='用語を編集';$('term').value=x.name||'';$('full').value=x.full||'';$('termnote').value=x.note||'';scrollTo(0,0)}
function deleteTerm(i){if(!confirm('この用語を削除しますか？'))return;set(T,get(T).filter(x=>String(x.id)!==String(i)));renderTerms();refresh()}
function items(){return [...get(D).map(x=>({id:x.id,label:x.title,type:'資料'})),...get(T).map(x=>({id:x.id,label:x.name,type:'用語'}))]}
function startReview(){q=items();n=0;showReview()}
function reviewOne(i){let x=get(D).find(v=>String(v.id)===String(i));q=x?[{id:x.id,label:x.title,type:'資料'}]:[];n=0;showReview()}
function showReview(){if(!q.length){$('reviewCard').innerHTML='<p>まず資料か用語を登録しよう。</p>';go('review');return}if(n>=q.length){$('reviewCard').innerHTML='<h2>今日の復習は完了！</h2><button onclick="go(\'home\')">ホームへ</button>';go('review');return}let x=q[n];$('reviewCard').innerHTML=`<div class="muted">${n+1} / ${q.length} ・ ${esc(x.type)}</div><h2>${esc(x.label)}</h2><p>自分の言葉で説明してみよう。</p><div class="actions"><button onclick="n++;showReview()">次を見る</button><button class="alt" onclick="go('home')">終了</button></div>`;go('review')}
function refresh(){$('due').textContent=items().length}
function exportData(){let b=new Blob([JSON.stringify({version:'0.5',docs:get(D),terms:get(T),exported:new Date().toISOString()},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='refine-note-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function importData(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let o=JSON.parse(r.result);if(!Array.isArray(o.docs)||!Array.isArray(o.terms))throw new Error();if(!confirm('現在のデータをバックアップ内容で置き換えます。よろしいですか？'))return;set(D,o.docs);set(T,o.terms);migrate();renderDocs();renderTerms();refresh();alert('復元しました')}catch{alert('このバックアップファイルは読み込めませんでした')}finally{e.target.value=''}};r.readAsText(f)}
migrate();renderDocs();renderTerms();refresh();
</script></body></html>
