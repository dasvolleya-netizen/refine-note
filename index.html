<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f2e9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Refine Note">
<link rel="manifest" href="./manifest.webmanifest">
<title>Refine Note</title>
<style>
:root{--bg:#f6f2e9;--card:#fffdf8;--ink:#26343a;--muted:#758087;--line:#e3ddd1;--accent:#79a99d;--soft:#deebe7}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}
main{max-width:760px;margin:auto;padding:22px 16px 105px}h1{font:700 31px Georgia,serif;margin:4px 0}.sub,.muted{color:var(--muted)}
.page{display:none}.page.active{display:block}.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;margin:14px 0}
.hero{background:linear-gradient(135deg,#e9f3ef,#fffdf8)}.big{font-size:34px;font-weight:800}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.action{min-height:105px;text-align:left}
button{border:0;border-radius:14px;padding:13px 15px;background:var(--accent);color:white;font:700 15px inherit}button.alt{background:#edf0ec;color:var(--ink)}
input,textarea,select{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:white;font:inherit;margin:6px 0 12px}textarea{min-height:85px}
.item{padding:13px 0;border-bottom:1px solid var(--line)}.item:last-child{border-bottom:0}.tag{display:inline-block;background:var(--soft);border-radius:999px;padding:4px 8px;margin:3px;font-size:12px}
.doccard{cursor:pointer}.detail-row{margin:10px 0}.detail-label{font-size:12px;color:var(--muted);margin-bottom:4px}
nav{position:fixed;bottom:0;left:0;right:0;background:#fffdf8ee;border-top:1px solid var(--line);backdrop-filter:blur(10px)}
nav div{max-width:760px;margin:auto;display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom)}
nav button{background:transparent;color:var(--muted);font-size:11px;padding:10px 2px}.tiny{font-size:12px}
</style>
</head>
<body>
<main>
<h1>Refine Note</h1><div class="sub">学んだことを、忘れっぱなしにしない。</div>

<section id="home" class="page active">
 <div class="card hero"><div class="muted">今日の復習</div><div class="big"><span id="due">0</span> 件</div><p class="muted">ノルマなし。できる分だけ進める。</p><button onclick="go('review')">復習を始める</button></div>
 <div class="grid">
  <button class="card action alt" onclick="go('add')"><b>＋ 資料を追加</b><br><span class="tiny muted">資料・メモを登録</span></button>
  <button class="card action alt" onclick="go('library')"><b>▤ 資料庫</b><br><span class="tiny muted">検索・整理</span></button>
  <button class="card action alt" onclick="go('terms')"><b>ABC 用語集</b><br><span class="tiny muted">略語・専門用語</span></button>
 </div>
</section>

<section id="add" class="page"><h2>資料を追加</h2><div class="card">
<label>タイトル</label><input id="title" placeholder="例：凝集の基礎">
<label>大分類</label><select id="category"><option>水処理</option><option>電気</option><option>機械</option><option>化学</option><option>言葉・文章</option><option>その他</option></select>
<label>自由タグ</label><input id="tags" placeholder="凝集, PAC, pH">
<label>メモ</label><textarea id="memo"></textarea>
<button onclick="saveDoc()">保存</button></div></section>

<section id="library" class="page"><h2>資料庫</h2><input id="search" placeholder="検索" oninput="renderDocs()"><div id="docs" class="card"></div></section>

<section id="detail" class="page"><h2>資料詳細</h2><div id="detailCard" class="card"></div></section>

<section id="terms" class="page"><h2>用語集</h2><div class="card">
<label>用語・略語</label><input id="term" placeholder="OCR">
<label>正式名称</label><input id="full" placeholder="Optical Character Recognition">
<label>意味・補足</label><textarea id="termnote"></textarea>
<button onclick="saveTerm()">追加</button></div><div id="termList" class="card"></div></section>

<section id="review" class="page"><h2>復習</h2><div class="card"><p id="reviewText">登録した資料や用語がここに出ます。</p><button onclick="nextReview()">次を見る</button> <button class="alt" onclick="go('home')">終了</button></div></section>

<section id="settings" class="page"><h2>設定</h2><div class="card"><b>Refine Note</b><p class="muted">無料・端末内保存を基本にした試作版。</p><button onclick="exportData()">バックアップを書き出す</button></div></section>
</main>

<nav><div>
<button onclick="go('home')">⌂<br>ホーム</button><button onclick="go('library')">▤<br>資料庫</button><button onclick="go('add')">＋<br>追加</button><button onclick="go('terms')">ABC<br>用語集</button><button onclick="go('settings')">⚙<br>設定</button>
</div></nav>

<script>
const D='rn_docs',T='rn_terms'; let ri=0,currentDocIndex=null;
const get=k=>{try{return JSON.parse(localStorage.getItem(k)||'[]')}catch{return[]}}, set=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
const esc=s=>String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function go(id){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active'); if(id==='library')renderDocs();if(id==='terms')renderTerms();if(id==='review')nextReview();refresh();scrollTo(0,0)}
function saveDoc(){if(!title.value.trim())return alert('タイトルを入力してください');let a=get(D);a.unshift({title:title.value.trim(),category:category.value,tags:tags.value.split(',').map(x=>x.trim()).filter(Boolean),memo:memo.value});set(D,a);title.value=tags.value=memo.value='';alert('保存しました');go('library')}
function renderDocs(){let q=(search.value||'').toLowerCase(),a=get(D);let rows=a.map((x,i)=>({...x,_i:i})).filter(x=>(x.title+' '+x.category+' '+x.tags.join(' ')+' '+x.memo).toLowerCase().includes(q));docs.innerHTML=rows.length?rows.map(x=>`<div class="item doccard" onclick="openDoc(${x._i})"><b>${esc(x.title)}</b><br><span class="tag">${esc(x.category)}</span>${x.tags.map(t=>`<span class="tag">#${esc(t)}</span>`).join('')}<p class="tiny">${esc(x.memo)}</p></div>`).join(''):'まだ資料がありません'}
function openDoc(i){const a=get(D),x=a[i];if(!x)return;currentDocIndex=i;detailCard.innerHTML=`<div class="detail-row"><div class="detail-label">タイトル</div><b>${esc(x.title)}</b></div><div class="detail-row"><div class="detail-label">大分類</div><span class="tag">${esc(x.category)}</span></div><div class="detail-row"><div class="detail-label">自由タグ</div>${x.tags.length?x.tags.map(t=>`<span class="tag">#${esc(t)}</span>`).join(''):'<span class="muted">なし</span>'}</div><div class="detail-row"><div class="detail-label">メモ</div><div>${esc(x.memo||'なし')}</div></div><hr style="border:0;border-top:1px solid var(--line);margin:18px 0"><button onclick="deleteCurrentDoc()">削除</button> <button class="alt" onclick="go('library')">戻る</button>`;go('detail')}
function deleteCurrentDoc(){if(currentDocIndex===null)return;if(!confirm('この資料を削除しますか？'))return;let a=get(D);a.splice(currentDocIndex,1);set(D,a);currentDocIndex=null;go('library')}
function saveTerm(){if(!term.value.trim())return alert('用語を入力してください');let a=get(T);a.unshift({name:term.value.trim(),full:full.value,note:termnote.value});set(T,a);term.value=full.value=termnote.value='';renderTerms()}
function renderTerms(){let a=get(T);termList.innerHTML=a.length?a.map(x=>`<div class="item"><b>${esc(x.name)}</b><div>${esc(x.full)}</div><p class="tiny">${esc(x.note)}</p></div>`).join(''):'まだ用語がありません'}
function nextReview(){let a=[...get(D).map(x=>x.title),...get(T).map(x=>x.name)];if(!a.length){reviewText.textContent='まず資料か用語を登録しよう。';return}if(ri>=a.length){reviewText.textContent='今日の復習は完了！';ri=0;return}reviewText.textContent=`「${a[ri++]}」について、自分の言葉で説明してみよう。`}
function refresh(){due.textContent=get(D).length+get(T).length}
function exportData(){let o={docs:get(D),terms:get(T),exported:new Date().toISOString()},b=new Blob([JSON.stringify(o,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='refine-note-backup.json';a.click()}
if('serviceWorker'in navigator){navigator.serviceWorker.register('./sw.js').then(r=>r.update());}
renderDocs();renderTerms();refresh();
</script>
</body></html>
